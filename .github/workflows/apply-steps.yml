name: Apply steps.json and open PR

on:
  workflow_dispatch:
  push:
    paths:
      - steps.json

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: dev/Gemfile
        run: |
          gem install bundler
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      # Batch apply: single Ruby process loads taxonomy once, applies all steps
      # in memory, dumps files once at the end. ~2min instead of ~2h.
      - name: Apply steps
        env:
          BUNDLE_GEMFILE: dev/Gemfile
        run: bundle exec ruby dev/scripts/batch_apply_steps.rb steps.json

      - name: Set branch name with timestamp
        id: branch
        run: echo "name=automation/apply-steps-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # Only commit changes under data/ — excludes dev/ bundle artifacts,
          # generated docs, and any other side effects from the CLI.
          add-paths: data/
          commit-message: Apply steps from steps.json
          title: "Apply steps from steps.json (${{ steps.branch.outputs.name }})"
          body: |
            This PR was automatically generated by the apply-steps workflow.
            It applies `steps.json` via `batch_apply_steps.rb` and commits only taxonomy data changes under `data/`.
          branch: ${{ steps.branch.outputs.name }}
          delete-branch: true
          labels: automation, product-taxonomy
          reviewers: jeanguo-png,audreyanneguindon

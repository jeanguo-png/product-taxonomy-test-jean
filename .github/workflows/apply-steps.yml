name: Apply steps.json and open PR

on:
  workflow_dispatch:
  push:
    paths:
      - steps.json

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: dev/Gemfile
        run: |
          gem install bundler
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      # Batch apply: single Ruby process loads taxonomy once, applies all steps
      # in memory, dumps files once at the end. ~2min instead of ~2h.
      - name: Apply steps
        env:
          BUNDLE_GEMFILE: dev/Gemfile
        run: bundle exec ruby dev/scripts/batch_apply_steps.rb steps.json

      # bundle install writes artifacts (dev/.bundle/config, dev/vendor/bundle/)
      # into the working tree. Discard them so the PR only contains taxonomy
      # data and docs changes, not development tooling files.
      # git checkout reverts modified tracked files; git clean removes new untracked files.
      - name: Discard dev/ changes
        run: |
          git checkout -- dev/ 2>/dev/null || true
          git clean -fd dev/

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Apply steps from steps.json
          title: Apply steps from steps.json
          body: |
            This PR was automatically generated by the apply-steps workflow.
            It runs `scripts/apply_steps.rb` which consumes `steps.json` and invokes the taxonomy CLI to update data and docs.
          branch: automation/apply-steps
          delete-branch: true
          labels: automation, product-taxonomy
